<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1 Lap Tracker — 2026 Season</title>
<style>
  :root{
    --bg:#0b0b10;
    --panel:#15151c;
    --panel-2:#1d1d27;
    --border:#2a2a38;
    --text:#e8e8ef;
    --muted:#8a8a9a;
    --red:#e10600;          /* F1 red */
    --red-dark:#b00500;
    --green:#00d26a;
    --yellow:#f5d54c;
    --purple:#b377ff;       /* overall best (F1 purple) */
    --accent:#2b8eff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{
    background:linear-gradient(90deg,#0b0b10 0%, #1a0004 50%, #0b0b10 100%);
    border-bottom:2px solid var(--red);
    padding:16px 24px;
    display:flex;align-items:center;justify-content:space-between;
  }
  header h1{margin:0;font-size:20px;letter-spacing:2px;text-transform:uppercase}
  header h1 .red{color:var(--red)}
  header .header-actions{display:flex;gap:8px;align-items:center}
  nav.series-nav{display:flex;gap:4px;margin-right:16px}
  nav.series-nav a{
    padding:6px 14px;border-radius:6px;font-size:12px;text-transform:uppercase;letter-spacing:1px;
    color:var(--muted);text-decoration:none;border:1px solid transparent;transition:all .15s;
  }
  nav.series-nav a:hover{color:var(--text);background:var(--panel-2)}
  nav.series-nav a.active{color:#fff;background:var(--red);border-color:var(--red)}
  .btn{
    background:var(--panel-2);color:var(--text);border:1px solid var(--border);
    padding:8px 14px;border-radius:6px;cursor:pointer;font-size:13px;
    transition:all .15s;
  }
  .btn:hover{border-color:var(--red);background:#22222e}
  .btn.primary{background:var(--red);border-color:var(--red);color:#fff}
  .btn.primary:hover{background:var(--red-dark);border-color:var(--red-dark)}
  .btn.danger{background:#2a0004;border-color:#5a0a10;color:#ff8080}
  .btn.danger:hover{background:#3a0006}
  .btn.small{padding:4px 8px;font-size:12px}
 
  main{flex:1;display:grid;grid-template-columns:300px 1fr;min-height:0}
 
  /* Sidebar */
  #sidebar{
    background:var(--panel);border-right:1px solid var(--border);
    overflow-y:auto;padding:12px;
  }
  #sidebar h2{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin:8px 6px 10px}
  .track-card{
    display:flex;align-items:center;gap:10px;
    padding:10px;border-radius:6px;cursor:pointer;
    border:1px solid transparent;background:transparent;
    margin-bottom:4px;color:var(--text);text-align:left;width:100%;
    font-family:inherit;
  }
  .track-card:hover{background:var(--panel-2)}
  .track-card.active{background:var(--panel-2);border-color:var(--red)}
  .track-card .num{
    width:26px;height:26px;border-radius:4px;background:#2a2a38;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:600;color:var(--muted);flex-shrink:0;
  }
  .track-card.active .num{background:var(--red);color:#fff}
  .track-card .info{flex:1;min-width:0}
  .track-card .info .name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .track-card .info .meta{font-size:11px;color:var(--muted);display:flex;gap:6px}
  .track-card .pb{font-size:11px;color:var(--purple);font-family:"SF Mono",Menlo,monospace}
 
  /* Content */
  #content{overflow-y:auto;padding:24px 32px}
  .track-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;gap:20px;flex-wrap:wrap}
  .track-header .title h2{margin:0;font-size:28px}
  .track-header .title .subtitle{color:var(--muted);font-size:14px;margin-top:4px}
  .track-header .stats{display:flex;gap:16px;flex-wrap:wrap}
  .stat{
    background:var(--panel);border:1px solid var(--border);
    padding:10px 16px;border-radius:8px;min-width:120px;
  }
  .stat .label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
  .stat .value{font-size:20px;font-weight:600;font-family:"SF Mono",Menlo,monospace;margin-top:2px}
  .stat .value.pb{color:var(--purple)}
  .stat .value.good{color:var(--green)}
 
  .panels{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:20px}
  .panel h3{margin:0 0 14px;font-size:13px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted)}
 
  /* Track map */
  .track-map{background:#0a0a12;border-radius:8px;padding:12px;display:flex;justify-content:center;align-items:center;min-height:280px}
  .track-map svg{width:100%;height:auto;max-height:320px}
  .track-map .track-line{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  .track-map .sector-s1{stroke:#ff4d6d}
  .track-map .sector-s2{stroke:#4dabff}
  .track-map .sector-s3{stroke:#ffcd3c}
  .track-map .start-line{stroke:#fff;stroke-width:3;stroke-dasharray:4 4}
  .track-map .sector-marker{fill:#fff;stroke:#000;stroke-width:1}
 
  .sector-legend{display:flex;gap:16px;margin-top:10px;justify-content:center;font-size:11px;color:var(--muted)}
  .sector-legend .dot{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:middle}
 
  /* Entry form */
  .form-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px}
  .form-row.full{grid-template-columns:1fr}
  .field label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:4px}
  .field input, .field select, .field textarea{
    width:100%;background:#0f0f16;border:1px solid var(--border);
    color:var(--text);padding:8px 10px;border-radius:6px;
    font-family:inherit;font-size:14px;
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none;border-color:var(--red);
  }
  .field input.time{font-family:"SF Mono",Menlo,monospace}
  .field .hint{font-size:10px;color:var(--muted);margin-top:3px}
  .form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
 
  /* History table */
  .history-wrap{overflow-x:auto}
  table.history{width:100%;border-collapse:collapse;font-size:13px}
  table.history th, table.history td{
    text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);
  }
  table.history th{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:500}
  table.history td.time{font-family:"SF Mono",Menlo,monospace}
  table.history tr.pb-row td.total{color:var(--purple);font-weight:600}
  table.history tr:hover{background:var(--panel-2)}
  .badge{display:inline-block;padding:2px 6px;border-radius:3px;font-size:10px;text-transform:uppercase;letter-spacing:.5px}
  .badge.s1{background:rgba(255,77,109,.15);color:#ff4d6d}
  .badge.s2{background:rgba(77,171,255,.15);color:#4dabff}
  .badge.s3{background:rgba(255,205,60,.15);color:#ffcd3c}
  .badge.pb{background:rgba(179,119,255,.2);color:var(--purple)}
  .empty{color:var(--muted);text-align:center;padding:30px;font-size:13px}
 
  /* Driver chip + leaderboard */
  .driver-chip{
    display:inline-block;padding:3px 9px;border-radius:4px;
    color:#fff;font-family:"SF Mono",Menlo,monospace;font-size:11px;font-weight:700;letter-spacing:1px;
    min-width:34px;text-align:center;
    text-shadow:0 1px 2px rgba(0,0,0,.5);
  }
  .driver-chip.tiny{padding:1px 5px;font-size:10px;min-width:26px}
  table.leaderboard{width:100%;border-collapse:collapse;font-size:13px}
  table.leaderboard th, table.leaderboard td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
  table.leaderboard th{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:500}
  table.leaderboard td.time{font-family:"SF Mono",Menlo,monospace}
  table.leaderboard td.delta{color:var(--muted);font-family:"SF Mono",Menlo,monospace;font-size:12px}
  table.leaderboard td.rank{
    font-family:"SF Mono",Menlo,monospace;font-weight:700;color:var(--muted);
    width:34px;text-align:center;font-size:14px;
  }
  table.leaderboard tr.gold td.rank{color:#ffd700;font-size:18px}
  table.leaderboard tr.silver td.rank{color:#c0c0c0;font-size:16px}
  table.leaderboard tr.bronze td.rank{color:#cd7f32;font-size:16px}
  table.leaderboard tr.gold td.total{color:var(--purple);font-weight:600}
  table.leaderboard tr:hover{background:var(--panel-2)}
 
  /* Scrollbars */
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:var(--bg)}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
  ::-webkit-scrollbar-thumb:hover{background:#3a3a4a}
 
  /* Hamburger + backdrop — desktop hidden, mobile only */
  .hamburger{
    display:none;align-items:center;justify-content:center;
    width:38px;height:38px;border-radius:6px;padding:0;
    background:transparent;border:1px solid var(--border);
    cursor:pointer;color:var(--text);flex-shrink:0;
  }
  .hamburger:hover{border-color:var(--red)}
  .hamburger svg{width:20px;height:20px}
  .header-left{display:flex;align-items:center;gap:12px;min-width:0}
  #sidebarBackdrop{
    display:none;position:fixed;inset:0;
    background:rgba(0,0,0,.6);z-index:150;backdrop-filter:blur(2px);
  }
  #sidebarBackdrop.open{display:block}
 
  /* Tablet */
  @media (max-width: 1100px){
    .panels{grid-template-columns:1fr}
  }
 
  /* Mobile */
  @media (max-width: 900px){
    main{grid-template-columns:1fr;grid-template-rows:1fr}
    header{padding:10px 14px}
    .hamburger{display:flex}
    header h1{font-size:15px;letter-spacing:1.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    header h1 > span[style*="muted"], header h1 > span[style*="sub"]{display:none}
    nav.series-nav{margin-right:6px}
    nav.series-nav a{padding:6px 10px;font-size:11px}
    .header-actions{gap:4px}
    .btn.small{padding:6px 10px;font-size:11px;min-height:34px}
 
    #sidebar{
      position:fixed;top:0;left:0;bottom:0;
      width:88%;max-width:320px;z-index:200;
      max-height:none;
      transform:translateX(-100%);transition:transform .25s ease;
      box-shadow:8px 0 28px rgba(0,0,0,.55);
      padding-top:10px;
    }
    #sidebar.open{transform:translateX(0)}
    #sidebar::before{
      content:"Tap a track to select";
      display:block;font-size:11px;color:var(--muted);
      padding:0 14px 10px;border-bottom:1px solid var(--border);margin-bottom:8px;
      text-transform:uppercase;letter-spacing:1px;
    }
 
    #content{padding:16px 14px;overflow-x:hidden}
 
    .track-header{gap:10px;flex-direction:column;align-items:stretch}
    .track-header .title h2{font-size:20px;line-height:1.2}
    .track-header .title .subtitle{font-size:12px}
    .track-header .stats{gap:6px;flex-wrap:wrap}
    .stat{min-width:0;flex:1 1 calc(33% - 4px);padding:8px 10px}
    .stat .label{font-size:9px}
    .stat .value{font-size:15px}
 
    .panel{padding:14px}
    .panel h3{font-size:12px;margin-bottom:10px}
 
    /* Form: stack everything, finger-friendly */
    .form-row{grid-template-columns:1fr !important;gap:8px}
    .field input, .field select, .field textarea{
      padding:12px 12px;font-size:16px; /* 16px prevents iOS zoom-on-focus */
      min-height:44px;border-radius:8px;
    }
    .field textarea{min-height:80px}
    .form-actions .btn{min-height:44px;padding:12px 18px;font-size:14px;flex:1}
 
    /* Tables: scroll horizontally with edge fade */
    .history-wrap{
      margin:0 -14px;padding:0 14px;
      scroll-padding-left:14px;
      -webkit-overflow-scrolling:touch;
    }
    table.history, table.leaderboard{min-width:640px}
    table.history td, table.leaderboard td,
    table.history th, table.leaderboard th{
      padding:10px 8px;white-space:nowrap;font-size:12px;
    }
    /* Sticky first column so driver chip / rank stays visible when scrolling */
    table.history th:first-child, table.history td:first-child,
    table.leaderboard th:first-child, table.leaderboard td:first-child{
      position:sticky;left:0;background:var(--panel);
      box-shadow:2px 0 4px rgba(0,0,0,.3);
    }
    table.history tr:hover td:first-child,
    table.leaderboard tr:hover td:first-child{background:var(--panel-2)}
 
    .track-map{min-height:220px;padding:8px}
    .track-map svg{max-height:260px}
    .sector-legend{font-size:10px;gap:10px}
  }
 
  /* Small phones */
  @media (max-width: 480px){
    header h1{font-size:14px}
    header h1 > .red{font-size:15px}
    nav.series-nav a{padding:5px 9px;font-size:10px;letter-spacing:.5px}
    .stat{flex:1 1 calc(50% - 3px)}
    .track-header .title h2{font-size:18px}
  }
</style>

/* ============================================================
   State + storage
   ============================================================ */
const PREFS_KEY = "f1-lap-tracker-prefs";
const OLD_LS_KEY = "f1-lap-tracker-v1"; // previous localStorage data schema
const state = {
  selectedTrackId: TRACKS[0].id,
  editingLapId: null,
  lastDriver: "",
  entries: {}, /* { trackId: [lap, lap, ...] }, mirrored from DB */
  loading: true
};
 
/* Local prefs = just UI-level preferences (selected track, last driver) */
function loadPrefs(){
  try{
    const raw = localStorage.getItem(PREFS_KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(d.selectedTrackId) state.selectedTrackId = d.selectedTrackId;
      if(d.lastDriver) state.lastDriver = d.lastDriver;
    }
  }catch(e){}
}
function savePrefs(){
  localStorage.setItem(PREFS_KEY, JSON.stringify({
    selectedTrackId: state.selectedTrackId,
    lastDriver: state.lastDriver
  }));
}
/* Backwards-compat shim — older code paths call saveState() */
function saveState(){ savePrefs(); }
 
/* ============================================================
   Supabase <-> in-memory lap mapping
   ============================================================ */
function toDbLap(lap, trackId){
  return {
    series: SERIES,
    track_id: trackId,
    driver: lap.driver,
    s1_ms: lap.s1,
    s2_ms: lap.s2,
    s3_ms: lap.s3,
    session: lap.session || null,
    lap_date: lap.date || null,
    car: lap.car || null,
    tyre: lap.tyre || null,
    weather: lap.weather || null,
    assists: lap.assists || null,
    ai: lap.ai || null,
    game: lap.game || null,
    notes: lap.notes || null
  };
}
function fromDbLap(row){
  return {
    id: row.id,
    driver: row.driver,
    s1: row.s1_ms, s2: row.s2_ms, s3: row.s3_ms, total: row.total_ms,
    session: row.session,
    date: row.lap_date,
    car: row.car, tyre: row.tyre, weather: row.weather,
    assists: row.assists, ai: row.ai, game: row.game,
    notes: row.notes,
    createdAt: row.created_at ? new Date(row.created_at).getTime() : Date.now()
  };
}
 
async function fetchAllLaps(){
  const { data, error } = await supa.from('laps').select('*').eq('series', SERIES);
  if(error){ console.error(error); alert('Failed to load laps: '+error.message); return; }
  state.entries = {};
  for(const row of data){
    if(!state.entries[row.track_id]) state.entries[row.track_id] = [];
    state.entries[row.track_id].push(fromDbLap(row));
  }
  state.loading = false;
}
async function insertLapDb(dbLap){
  const { data, error } = await supa.from('laps').insert(dbLap).select().single();
  if(error) throw error;
  return data;
}
async function updateLapDb(id, dbLap){
  const { data, error } = await supa.from('laps').update(dbLap).eq('id', id).select().single();
  if(error) throw error;
  return data;
}
async function deleteLapDb(id){
  const { error } = await supa.from('laps').delete().eq('id', id);
  if(error) throw error;
}
 
/* Color per driver — hash the initials to a consistent hue */
function driverColor(initials){
  if(!initials) return "#555";
  const s = String(initials).toUpperCase();
  let hash = 0;
  for(let i=0;i<s.length;i++) hash = ((hash<<5) - hash + s.charCodeAt(i))|0;
  const hue = Math.abs(hash) % 360;
  return `hsl(${hue}, 62%, 48%)`;
}
function driverChip(initials, tiny=false){
  if(!initials) return "";
  const color = driverColor(initials);
  return `<span class="driver-chip${tiny?" tiny":""}" style="background:${color}">${initials}</span>`;
}
 
/* ============================================================
   Time parsing + formatting
   Accepts: "1:23.456", "83.456", "1:23", "83", "1:23.4"
   ============================================================ */
function parseTime(str){
  if(!str) return null;
  str = String(str).trim();
  if(!str) return null;
  let ms;
  if(str.includes(":")){
    const parts = str.split(":");
    const m = parseInt(parts[0], 10);
    const s = parseFloat(parts[1]);
    if(isNaN(m) || isNaN(s)) return null;
    ms = (m*60 + s)*1000;
  }else{
    const s = parseFloat(str);
    if(isNaN(s)) return null;
    ms = s*1000;
  }
  return Math.round(ms);
}
function formatTime(ms, opts={}){
  if(ms == null || isNaN(ms)) return "—";
  const total = Math.round(ms);
  const m = Math.floor(total/60000);
  const s = Math.floor((total%60000)/1000);
  const f = total%1000;
  if(m === 0 && opts.compact){
    return `${s}.${String(f).padStart(3,"0")}`;
  }
  return `${m}:${String(s).padStart(2,"0")}.${String(f).padStart(3,"0")}`;
}
 
/* ============================================================
   Lap helpers — PBs, totals, colors
   ============================================================ */
function getLaps(trackId){ return state.entries[trackId] || []; }
function getPBs(trackId){
  const laps = getLaps(trackId);
  if(!laps.length) return {overall:null, s1:null, s2:null, s3:null, theoretical:null, overallLap:null};
  let overallLap = null;
  for(const l of laps){
    if(Number.isFinite(l.total) && (!overallLap || l.total < overallLap.total)) overallLap = l;
  }
  const overall = overallLap ? overallLap.total : null;
  const s1 = Math.min(...laps.map(l=>l.s1).filter(Number.isFinite));
  const s2 = Math.min(...laps.map(l=>l.s2).filter(Number.isFinite));
  const s3 = Math.min(...laps.map(l=>l.s3).filter(Number.isFinite));
  const theoretical = [s1,s2,s3].every(Number.isFinite) ? s1+s2+s3 : null;
  return {overall, s1, s2, s3, theoretical, overallLap};
}
function sectorColor(val, pb){
  if(val == null || pb == null) return "";
  if(val === pb) return "var(--purple)";
  return "";
}

function applySectorSplit(t){
  const p1 = document.getElementById("trackPath-s1");
  const p2 = document.getElementById("trackPath-s2");
  const p3 = document.getElementById("trackPath-s3");
  if(!p1||!p2||!p3) return;
  const L = p1.getTotalLength();
  const [e1, e2] = t.sectors;
  const l1 = L*e1, l2 = L*(e2-e1), l3 = L*(1-e2);
  p1.setAttribute("stroke-dasharray", `${l1} ${L}`);
  p1.setAttribute("stroke-dashoffset", "0");
  p2.setAttribute("stroke-dasharray", `${l2} ${L}`);
  p2.setAttribute("stroke-dashoffset", `${-l1}`);
  p3.setAttribute("stroke-dasharray", `${l3} ${L}`);
  p3.setAttribute("stroke-dashoffset", `${-(l1+l2)}`);
 
  // Markers: start/finish + sector dividers
  const markers = document.getElementById("sectorMarkers");
  markers.innerHTML = "";
  const startPt = p1.getPointAtLength(0);
  const s1Pt = p1.getPointAtLength(l1);
  const s2Pt = p1.getPointAtLength(l1+l2);
  const addDot = (pt,color,size=6)=>{
    const c = document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("cx",pt.x); c.setAttribute("cy",pt.y);
    c.setAttribute("r",size); c.setAttribute("fill",color);
    c.setAttribute("stroke","#fff"); c.setAttribute("stroke-width","1.5");
    markers.appendChild(c);
  };
  addDot(startPt, "#fff", 7);  // start/finish
  addDot(s1Pt, "#ff4d6d");
  addDot(s2Pt, "#4dabff");
}

function recalcTotal(){
  const form = document.getElementById("lapForm");

  const s1 = parseTime(form.s1.value);
  const s2 = parseTime(form.s2.value);
  const s3 = parseTime(form.s3.value);
  const total = [s1,s2,s3].every(Number.isFinite) ? s1+s2+s3 : null;
  form.total.value = total!=null ? formatTime(total) : "";
}
 
async function onSubmitLap(e){
  e.preventDefault();
  const form = e.target;
  const fd = new FormData(form);
  const s1 = parseTime(fd.get("s1"));
  const s2 = parseTime(fd.get("s2"));
  const s3 = parseTime(fd.get("s3"));
  if(![s1,s2,s3].every(Number.isFinite)){
    alert("Enter all three sector times. Format: 24.123 or 1:24.123");
    return;
  }
  const driver = String(fd.get("driver")||"").trim().toUpperCase().slice(0,4);
  if(!driver){
    alert("Enter driver initials.");
    return;
  }
  const tId = state.selectedTrackId;
  const existingId = fd.get("id");
  const lapShape = {
    driver,
    s1, s2, s3,
    session: fd.get("session"),
    date: fd.get("date"),
    car: fd.get("car"),
    tyre: fd.get("tyre"),
    weather: fd.get("weather"),
    assists: fd.get("assists"),
    ai: fd.get("ai"),
    game: fd.get("game"),
    notes: fd.get("notes")
  };
  const dbLap = toDbLap(lapShape, tId);
 
  const submitBtn = form.querySelector('button[type=submit]');
  const originalText = submitBtn.textContent;
  submitBtn.disabled = true;
  submitBtn.textContent = "Saving…";
 
  try {
    if(existingId){
      await updateLapDb(existingId, dbLap);
    } else {
      await insertLapDb(dbLap);
    }
    state.lastDriver = driver;
    state.editingLapId = null;
    savePrefs();
    await fetchAllLaps();
    renderSidebar();
    renderContent();
  } catch(err){
    alert("Save failed: " + err.message);
    submitBtn.disabled = false;
    submitBtn.textContent = originalText;
  }
}
 
function renderLeaderboard(laps){
  // Best lap per driver, ranked
  const byDriver = new Map();
  for(const l of laps){
    const d = (l.driver||"").trim().toUpperCase();
    if(!d || !Number.isFinite(l.total)) continue;
    if(!byDriver.has(d) || byDriver.get(d).total > l.total) byDriver.set(d, l);
  }
  const ranked = Array.from(byDriver.values()).sort((a,b)=>a.total-b.total).slice(0,10);
  if(!ranked.length) return `<div class="empty">No laps with driver initials yet. Log a lap with your initials to start the leaderboard.</div>`;
  const best = ranked[0].total;
  const medal = i => i===0?"gold":i===1?"silver":i===2?"bronze":"";
  return `
    <table class="leaderboard">
      <thead>
        <tr><th></th><th>Driver</th><th>Best Lap</th><th>Δ to P1</th><th>S1</th><th>S2</th><th>S3</th><th>Car</th><th>Date</th></tr>
      </thead>
      <tbody>
        ${ranked.map((l,i)=>`
          <tr class="${medal(i)}">
            <td class="rank">${i+1}</td>
            <td>${driverChip(l.driver)}</td>
            <td class="time total">${formatTime(l.total)}</td>
            <td class="delta">${i===0?"—":"+"+formatTime(l.total-best,{compact:true})}</td>
            <td class="time">${formatTime(l.s1,{compact:true})}</td>
            <td class="time">${formatTime(l.s2,{compact:true})}</td>
            <td class="time">${formatTime(l.s3,{compact:true})}</td>
            <td>${l.car||""}</td>
            <td>${l.date||""}</td>
          </tr>
        `).join("")}
      </tbody>
    </table>
  `;
}
 
function renderHistory(t, pbs, laps){
  if(!laps.length) return `<div class="empty">No laps logged yet for this track. Punch in your first one above.</div>`;
  return `
    <table class="history">
      <thead>
        <tr>
          <th>Driver</th><th>Date</th><th>Session</th><th>S1</th><th>S2</th><th>S3</th><th>Total</th>
          <th>Car</th><th>Tyre</th><th>Weather</th><th>Notes</th><th></th>
        </tr>
      </thead>
      <tbody>
        ${laps.map(l=>{
          const isPB = l.total===pbs.overall;
          const s1PB = l.s1===pbs.s1;
          const s2PB = l.s2===pbs.s2;
          const s3PB = l.s3===pbs.s3;
          return `
            <tr class="${isPB?"pb-row":""}">
              <td>${driverChip(l.driver)}</td>
              <td>${l.date||""}</td>
              <td>${l.session||""}</td>
              <td class="time" ${s1PB?'style="color:var(--purple);font-weight:600"':""}>${formatTime(l.s1,{compact:true})}</td>
              <td class="time" ${s2PB?'style="color:var(--purple);font-weight:600"':""}>${formatTime(l.s2,{compact:true})}</td>
              <td class="time" ${s3PB?'style="color:var(--purple);font-weight:600"':""}>${formatTime(l.s3,{compact:true})}</td>
              <td class="time total">${formatTime(l.total)} ${isPB?'<span class="badge pb">PB</span>':""}</td>
              <td>${l.car||""}</td>
              <td>${l.tyre||""}</td>
              <td>${l.weather||""}</td>
              <td title="${(l.notes||"").replace(/"/g,"&quot;")}">${(l.notes||"").slice(0,30)}${l.notes&&l.notes.length>30?"…":""}</td>
              <td>
                <button class="btn small" data-edit="${l.id}">Edit</button>
                <button class="btn small danger" data-delete="${l.id}">×</button>
              </td>
            </tr>
          `;
        }).join("")}
      </tbody>
    </table>
  `;
}
 
/* ============================================================
   Import / Export
   ============================================================ */
$("#exportBtn").addEventListener("click", ()=>{
  const blob = new Blob([JSON.stringify({entries:state.entries, exportedAt:new Date().toISOString()}, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `f1-lap-tracker-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
});
$("#importBtn").addEventListener("click", ()=>$("#importFile").click());
$("#importFile").addEventListener("change", async e=>{
  const file = e.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(!data.entries) throw new Error("Invalid file");
    if(!confirm("Import will insert these laps into the cloud database. Continue?")) return;
    const rows = [];
    for(const tId of Object.keys(data.entries)){
      for(const lap of data.entries[tId]) rows.push(toDbLap(lap, tId));
    }
    if(rows.length === 0){ alert("Nothing to import."); e.target.value=""; return; }
    const { error } = await supa.from('laps').insert(rows);
    if(error) throw error;
    await fetchAllLaps();
    renderSidebar(); renderContent();
    alert(`Imported ${rows.length} lap${rows.length===1?"":"s"}.`);
  }catch(err){
    alert("Import failed: " + err.message);
  }
  e.target.value = "";
});
 
/* ============================================================
   Migrate Local — one-shot upload of old localStorage laps
   ============================================================ */
function hasLocalLegacy(){
  try{
    const raw = localStorage.getItem(OLD_LS_KEY);
    if(!raw) return false;
    const d = JSON.parse(raw);
    return d && d.entries && Object.keys(d.entries).length > 0;
  }catch(e){ return false; }
}
if(hasLocalLegacy()){
  $("#migrateBtn").style.display = "";
}
$("#migrateBtn").addEventListener("click", async ()=>{
  const raw = localStorage.getItem(OLD_LS_KEY);
  if(!raw){ alert("No local laps found."); return; }
  let legacy;
  try{ legacy = JSON.parse(raw); }catch(e){ alert("Couldn't parse local data."); return; }
  if(!legacy.entries){ alert("Nothing to migrate."); return; }
  const rows = [];
  for(const tId of Object.keys(legacy.entries)){
    for(const lap of legacy.entries[tId]) rows.push(toDbLap(lap, tId));
  }
  if(rows.length === 0){ alert("Nothing to migrate."); return; }
  if(!confirm(`Upload ${rows.length} lap${rows.length===1?"":"s"} from this browser into Supabase?`)) return;
  const btn = $("#migrateBtn");
  btn.disabled = true; btn.textContent = "Migrating…";
  try{
    const { error } = await supa.from('laps').insert(rows);
    if(error) throw error;
    // Archive the old key so we don't offer to re-migrate
    localStorage.setItem(OLD_LS_KEY + "-migrated", raw);
    localStorage.removeItem(OLD_LS_KEY);
    btn.style.display = "none";
    await fetchAllLaps();
    renderSidebar(); renderContent();
    alert(`Migrated ${rows.length} lap${rows.length===1?"":"s"} to the cloud.`);
  }catch(err){
    alert("Migration failed: " + err.message);
    btn.disabled = false; btn.textContent = "Migrate Local";
  }
});
 
/* ============================================================
   Realtime — other devices pushing laps appear live
   ============================================================ */
function setupRealtime(){
  supa
    .channel('laps-f1')
    .on('postgres_changes',
      { event: '*', schema: 'public', table: 'laps', filter: `series=eq.${SERIES}` },
      async () => {
        await fetchAllLaps();
        renderSidebar();
        renderContent();
      })
    .subscribe();
}
 
/* ============================================================
   Init
   ============================================================ */
(async function init(){
  loadPrefs();
  renderSidebar();
  renderContent(); // first paint shows "Loading…" because state.loading === true
  try{
    await fetchAllLaps();
  }catch(err){
    console.error(err);
    alert("Couldn't load laps from Supabase: " + (err.message||err));
    state.loading = false;
  }
  renderSidebar();
  renderContent();
  setupRealtime();
})();
</script>
